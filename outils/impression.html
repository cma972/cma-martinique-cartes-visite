<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Cartes QR à imprimer – CMA Martinique</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/carte.css">
  <style>
    /* Planche A4 : 10 cartes 95 × 55 mm (2 colonnes × 5 lignes), traits de coupe.
       Feuille 1 : recto QR code nominatif. Feuille 2 : verso CMA (identique pour tous). */
    @page { size: A4; margin: 0; }

    body { background: #E9E2E0; }

    .barre {
      max-width: 210mm; margin: 24px auto 16px; padding: 18px 20px;
      background: var(--blanc); border-radius: 16px;
      display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between;
    }
    .barre h1 { margin: 0; font-family: var(--f-titre); font-weight: 400; font-size: 22px; color: var(--rouge); }
    .barre p { margin: 4px 0 0; font-size: 13px; color: var(--gris); max-width: 60ch; }
    .barre .btn-contact { width: auto; min-height: 48px; font-size: 15px; }

    .feuille {
      position: relative;
      width: 210mm; height: 297mm;
      margin: 0 auto 24px;
      background: #FFFFFF;
      overflow: hidden;
      break-after: page;
    }
    .grille-cartes {
      position: absolute; left: 10mm; top: 11mm;
      display: grid;
      grid-template-columns: repeat(2, 95mm);
      grid-auto-rows: 55mm;
    }

    /* Traits de coupe */
    .coupe { position: absolute; background: #231F20; }
    .coupe.v { width: .2mm; height: 5mm; }
    .coupe.h { height: .2mm; width: 5mm; }

    /* ----- Recto QR ----- */
    .cv {
      position: relative; width: 95mm; height: 55mm; overflow: hidden;
      display: grid; grid-template-columns: 1fr 37mm;
      background: #FFFFFF; color: var(--encre);
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .cv__gauche { display: flex; flex-direction: column; padding: 5mm 3mm 4.2mm 5.5mm; min-width: 0; }
    .cv__logo { display: flex; flex-direction: column; align-items: center; width: 19mm; gap: .9mm; }
    .cv__logo svg { width: 19mm; height: auto; }
    .cv__badge {
      font-family: var(--f-badge); font-size: 7.4pt; line-height: 1; letter-spacing: .02em;
      color: #FFFFFF; background: var(--rouge); border-radius: .9mm; padding: .55mm 1.6mm .35mm;
    }
    .cv__logo-agent { height: 13.5mm; width: auto; align-self: flex-start; }
    .cv__nom {
      margin: 3.2mm 0 0; font-family: var(--f-titre); font-weight: 400; font-size: 11pt; line-height: 1.15;
      color: var(--rouge); text-wrap: balance;
    }
    .cv__nom span { text-transform: uppercase; }
    .cv__fonction { margin: 1.2mm 0 0; font-size: 6.8pt; font-weight: 500; line-height: 1.3; }
    .cv__service { margin: .6mm 0 0; font-size: 6.1pt; line-height: 1.3; color: var(--gris); }
    .cv__appel {
      margin-top: auto; display: flex; align-items: center; gap: 1.5mm;
      font-size: 6.2pt; font-weight: 600; line-height: 1.25; color: var(--rouge);
    }
    .cv__appel svg { width: 4.2mm; height: 4.2mm; flex: none; }

    .cv__droite {
      position: relative; background: var(--corail);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2mm;
    }
    .cv__qr { width: 29mm; height: 29mm; padding: 1.4mm; background: #FFFFFF; border-radius: 2.2mm; }
    .cv__qr svg { width: 100%; height: 100%; }
    .cv__scan { font-family: var(--f-badge); font-size: 11pt; letter-spacing: .08em; color: #FFFFFF; line-height: 1; }
    .cv__pli { position: absolute; left: 0; top: 0; width: 9mm; height: 100%; }

    /* ----- Verso CMA ----- */
    .cv--verso { display: block; background: var(--corail); }
    .cv--verso svg { width: 100%; height: 100%; }

    @media print {
      body { background: #FFFFFF; }
      .barre { display: none; }
      .feuille { margin: 0; }
    }
  </style>
</head>
<body>
  <header class="barre">
    <div>
      <h1>Cartes QR à imprimer</h1>
      <p>Imprimez sur papier A4 épais (250 à 350 g) : <strong>échelle 100 %</strong>, <strong>sans marges</strong> (« Aucune »), <strong>recto verso bord long</strong>. Découpez en suivant les traits de coupe.</p>
    </div>
    <button type="button" class="btn-contact" id="imprimer">Imprimer</button>
  </header>
  <div id="planches"></div>

  <script>window.CMA_PAGE_OUTILS = true;</script>
  <script src="../assets/vendor/qrcode.js"></script>
  <script src="../assets/js/carte.js"></script>
  <script>
    (function () {
      var O = window.CMA_OUTILS, e = O.echapper;
      var FLECHE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><path d="M8 12h8M13 8.5l3.5 3.5-3.5 3.5"/></svg>';

      function logo(agent) {
        if (agent.logo) return '<img class="cv__logo-agent" src="../' + e(agent.logo) + '" alt="' + e(agent.logoTexte || "") + '">';
        return '<div class="cv__logo"><svg viewBox="182.6 39.3 87.6 44.9" fill="#A81A18" fill-rule="evenodd" aria-label="CMA">' + O.logoCma + "</svg>" +
          '<span class="cv__badge">MARTINIQUE</span></div>';
      }

      function recto(agent, base) {
        var url = base + agent.id + "/";
        return '<div class="cv"><div class="cv__gauche">' + logo(agent) +
          '<p class="cv__nom">' + e(O.nomComplet(agent)) + "</p>" +
          (agent.fonction ? '<p class="cv__fonction">' + e(agent.fonction) + "</p>" : "") +
          (agent.service ? '<p class="cv__service">' + e(agent.service) + "</p>" : "") +
          '<p class="cv__appel">' + FLECHE + "<span>Scannez le QR code pour enregistrer ma carte de visite numérique</span></p>" +
          '</div><div class="cv__droite">' +
          '<svg class="cv__pli" viewBox="0 0 10 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0h6L0 100Z" fill="#A6151B" opacity=".9"/></svg>' +
          '<div class="cv__qr">' + O.qrEnSvg(O.creerQr(url), "#231F20") + "</div>" +
          '<span class="cv__scan">Scannez-moi</span></div></div>';
      }

      function verso(site) {
        return '<div class="cv cv--verso recto">' + O.recto(site).replace('viewBox="0 0 985 640"', 'viewBox="0 0 985 563" preserveAspectRatio="xMidYMid slice"') + "</div>";
      }

      function traits() {
        var h = "", x, y;
        [10, 105, 200].forEach(function (x) {
          h += '<i class="coupe v" style="left:' + (x - .1) + 'mm;top:4mm"></i><i class="coupe v" style="left:' + (x - .1) + 'mm;top:288mm"></i>';
        });
        for (y = 11; y <= 286; y += 55) {
          h += '<i class="coupe h" style="top:' + (y - .1) + 'mm;left:3mm"></i><i class="coupe h" style="top:' + (y - .1) + 'mm;left:202mm"></i>';
        }
        return h;
      }

      function feuille(contenu) {
        return '<section class="feuille">' + traits() + '<div class="grille-cartes">' + contenu + "</div></section>";
      }

      fetch("../data/agents.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (d) {
        var org = d.organisation;
        var base = (org.adresseDuSitePublic || new URL("../", location.href).href).replace(/\/?$/, "/");
        var actifs = d.agents.filter(function (a) { return a.actif !== false; });
        var html = "";
        for (var i = 0; i < actifs.length; i += 10) {
          var lot = actifs.slice(i, i + 10);
          html += feuille(lot.map(function (a) { return recto(a, base); }).join(""));
          /* Verso toujours complet (10 cartes) : en recto verso, chaque carte a son dos même sur une feuille incomplète */
          html += feuille(new Array(11).join(verso(org.siteWebAffiche)));
        }
        document.getElementById("planches").innerHTML = html;
        document.body.setAttribute("data-pret", "1");
      });

      document.getElementById("imprimer").addEventListener("click", function () { window.print(); });
    })();
  </script>
</body>
</html>
